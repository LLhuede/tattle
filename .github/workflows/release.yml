# Builds tattle for every system the plugin supports and packages the plugin.
#
# Runs only when started by hand (Actions tab -> "Plugin release" -> Run
# workflow). It never runs on push. It pushes the `plugin-dist` branch only
# when "push" is ticked; otherwise the packaged plugin is kept as a
# downloadable artifact to inspect.
#
# To release, either:
# - tag the commit (e.g. v0.9.1) and push the tag, then run this workflow on
#   the tag with "push" ticked. It creates a *draft* GitHub Release for the
#   tag with the binaries attached; review the notes and publish it from the
#   Releases page. Or:
# - run it on main with "push" ticked and "tag" filled in (e.g. v0.9.1). It
#   then publishes the GitHub Release itself, which creates the tag on the
#   commit that was built. The tag must be "v" plus the version in Cargo.toml.
name: Plugin release

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push the plugin-dist branch (what users install from)"
        type: boolean
        default: false
      tag:
        description: "Run on a branch only: publish a release and create this tag (e.g. v0.9.1)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15
            name: tattle-darwin-universal
          # Oldest supported Ubuntu runner: an older glibc runs on more Linux systems.
          - os: ubuntu-22.04
            name: tattle-linux-x86_64
          - os: ubuntu-22.04-arm
            name: tattle-linux-aarch64
          - os: windows-latest
            name: tattle-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "$RUNNER_OS" = macOS ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi
      - name: Test
        shell: bash
        run: cargo test --release
      - name: Build
        shell: bash
        run: |
          mkdir -p out
          case "$RUNNER_OS" in
            macOS)
              cargo build --release -p tattle --target aarch64-apple-darwin
              cargo build --release -p tattle --target x86_64-apple-darwin
              lipo -create -output "out/${{ matrix.name }}" target/aarch64-apple-darwin/release/tattle target/x86_64-apple-darwin/release/tattle ;;
            Windows)
              cargo build --release -p tattle
              cp target/release/tattle.exe "out/${{ matrix.name }}" ;;
            *)
              cargo build --release -p tattle
              cp target/release/tattle "out/${{ matrix.name }}" ;;
          esac
          chmod +x "out/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.name }}
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: plugin/dist
          merge-multiple: true
      - name: Check the tag to create
        if: ${{ inputs.tag != '' }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          want="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$GITHUB_REF_TYPE" != branch ] || [ "$TAG" != "$want" ]; then
            echo "tag must be $want and the run must be on a branch (got '$TAG' on a $GITHUB_REF_TYPE)" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists" >&2
            exit 1
          fi
          # Only in this checkout, so the plugin is stamped with the plain version.
          git tag "$TAG"
      - name: Package the plugin-dist branch
        run: |
          chmod +x plugin/dist/*
          ls -l plugin/dist
          git config user.name "tattle release"
          git config user.email "noreply@localhost"
          if [ "${{ inputs.push }}" = "true" ]; then
            sh scripts/release_plugin.sh --no-build --push
          else
            sh scripts/release_plugin.sh --no-build
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: plugin
      - name: Draft a GitHub Release (when run on a tag with push ticked)
        if: ${{ inputs.push && github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd plugin/dist
          sha256sum tattle-* > SHA256SUMS
          gh release create "${{ github.ref_name }}" tattle-* SHA256SUMS --draft --verify-tag \
            --title "tattle ${{ github.ref_name }}" \
            --notes "Install in Claude Code: \`/plugin marketplace add ${{ github.repository }}#plugin-dist\` then \`/plugin install tattle@tattle\`. Binaries and SHA-256 checksums are attached. See README.md for what tattle catches and its measured results."
      - name: Publish a GitHub Release and its tag (when "tag" is filled in, with push ticked)
        if: ${{ inputs.push && inputs.tag != '' && github.ref_type == 'branch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cd plugin/dist
          sha256sum tattle-* > SHA256SUMS
          gh release create "$TAG" tattle-* SHA256SUMS --target "$GITHUB_SHA" \
            --title "tattle $TAG" \
            --notes "Install in Claude Code: \`/plugin marketplace add ${{ github.repository }}#plugin-dist\` then \`/plugin install tattle@tattle\`. Binaries and SHA-256 checksums are attached. See README.md for what tattle catches and its measured results."
