# Builds tattle for every system the plugin supports and packages the plugin.
#
# Runs only when started by hand (Actions tab -> "Plugin release" -> Run
# workflow). It never runs on push. It pushes the `plugin-dist` branch only
# when "push" is ticked; otherwise the packaged plugin is kept as a
# downloadable artifact to inspect.
#
# To release: tag the commit (e.g. v0.9.0) and push the tag, then run this
# workflow on the tag with "push" ticked. It also creates a *draft* GitHub
# Release for the tag with the binaries attached; review the notes and
# publish it from the Releases page.
name: Plugin release

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push the plugin-dist branch (what users install from)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            name: tattle-darwin-universal
          # Oldest supported Ubuntu runner: an older glibc runs on more Linux systems.
          - os: ubuntu-22.04
            name: tattle-linux-x86_64
          - os: ubuntu-22.04-arm
            name: tattle-linux-aarch64
          - os: windows-latest
            name: tattle-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "$RUNNER_OS" = macOS ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi
      - name: Test
        shell: bash
        run: cargo test --release
      - name: Build
        shell: bash
        run: |
          mkdir -p out
          case "$RUNNER_OS" in
            macOS)
              cargo build --release -p tattle --target aarch64-apple-darwin
              cargo build --release -p tattle --target x86_64-apple-darwin
              lipo -create -output "out/${{ matrix.name }}" target/aarch64-apple-darwin/release/tattle target/x86_64-apple-darwin/release/tattle ;;
            Windows)
              cargo build --release -p tattle
              cp target/release/tattle.exe "out/${{ matrix.name }}" ;;
            *)
              cargo build --release -p tattle
              cp target/release/tattle "out/${{ matrix.name }}" ;;
          esac
          chmod +x "out/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.name }}
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: plugin/dist
          merge-multiple: true
      - name: Package the plugin-dist branch
        run: |
          chmod +x plugin/dist/*
          ls -l plugin/dist
          git config user.name "tattle release"
          git config user.email "noreply@localhost"
          if [ "${{ inputs.push }}" = "true" ]; then
            sh scripts/release_plugin.sh --no-build --push
          else
            sh scripts/release_plugin.sh --no-build
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: plugin
      - name: Draft a GitHub Release (when run on a tag with push ticked)
        if: ${{ inputs.push && github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd plugin/dist
          sha256sum tattle-* > SHA256SUMS
          gh release create "${{ github.ref_name }}" tattle-* SHA256SUMS --draft --verify-tag \
            --title "tattle ${{ github.ref_name }}" \
            --notes "Install in Claude Code: \`/plugin marketplace add ${{ github.repository }}#plugin-dist\` then \`/plugin install tattle@tattle\`. Binaries and SHA-256 checksums are attached. See README.md for what tattle catches and its measured results."
